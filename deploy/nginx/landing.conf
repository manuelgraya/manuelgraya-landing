# Sitio nginx de la landing.
# Ubicacion en el servidor: /etc/nginx/sites-enabled/landing
# Recargar tras cambios:    sudo nginx -t && sudo systemctl reload nginx
#
# Requiere las directivas de nivel http de hardening-http.snippet
# (zonas landing_general / landing_api y real_ip). Ver README.md.

server {
    listen 8090;
    server_name _;
    root /srv/landing;
    index index.html;
    error_page 404 /404.html;

    access_log /var/log/nginx/landing.access.log;
    error_log  /var/log/nginx/landing.error.log;

    # Anti-flood general de la landing
    limit_req zone=landing_general burst=60 nodelay;

    # Solo los dos endpoints exactos de la API (POST /api/contacto y
    # GET /api/contacto/captcha). Un prefijo dejaría pasar /api/contacto.py
    # o /api/contactoXYZ al backend en vez de dar la 404 del sitio.
    location ~ ^/api/contacto(/captcha)?$ {
        # Rate limit estricto para la API (captcha + envios) -> 429 al saturar
        limit_req zone=landing_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # El repo entero es el web root: cierra lo que no es contenido del sitio.
    # Todo /api/ salvo los endpoints de arriba (la regex gana al prefijo), p. ej.
    # /api/contacto.py, y los scripts de deploy dan la 404 del sitio.
    location /api/ {
        return 404;
    }

    location /deploy/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
